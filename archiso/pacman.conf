#
# Foxtail ISO build pacman.conf. build-iso.sh fills in @LOCALREPO@ (locally
# built packages), @MIRRORLIST@ and @PKGCACHE@ (a cache separate from the host's).
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
CacheDir    = @PKGCACHE@

# Local copy of the signed [foxtail] repo (build/foxtail-repo), just built
# and signed by build-repo.sh. The build host's keyring doesn't know the
# Foxtail key (and shouldn't have to), so skip verification for this local
# copy only; installed systems require signatures (see bin/foxtail-install).
[foxtail]
SigLevel = Never
Server = file://@LOCALREPO@

[core]
Include = @MIRRORLIST@

[extra]
Include = @MIRRORLIST@
