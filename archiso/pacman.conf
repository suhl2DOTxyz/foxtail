#
# Foxtail ISO build pacman.conf. build-iso.sh fills in @LOCALREPO@ (locally
# built AUR packages), @MIRRORLIST@ and @PKGCACHE@ (a cache separate from the host's).
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
CacheDir    = @PKGCACHE@

[foxtail-local]
SigLevel = Optional TrustAll
Server = file://@LOCALREPO@

[core]
Include = @MIRRORLIST@

[extra]
Include = @MIRRORLIST@
