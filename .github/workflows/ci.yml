# Checks on every push and pull request; the ISO build and boot test on
# version tags (v*) or when started by hand (Actions ▸ CI ▸ Run workflow).
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      iso:
        description: Build the ISO and boot-test it
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git qt6-declarative quickshell shellcheck lua python
      - uses: actions/checkout@v4
      - name: Lint
        run: ./scripts/lint.sh /usr/lib/qt6/qml

  iso:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.iso
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build the ISO (in an Arch container)
        run: |
          docker run --privileged --rm -v "$PWD:/src" -w /src archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed archiso base-devel git sudo python jq imagemagick
            useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chown -R builder /src
            sudo -u builder ./scripts/build-aur.sh
            # CI has no signing key: build an unsigned test image.
            FOXTAIL_UNSIGNED=1 SUDO_USER=builder ./scripts/build-iso.sh
          '
      - name: Boot test
        run: |
          # The container left the checkout owned by its builder user.
          sudo chown -R "$(id -u):$(id -g)" .
          # Let QEMU use KVM (software emulation would take far too long).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf socat imagemagick
          ./tests/boot-test.sh out/foxtail-*.iso
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test
          path: |
            tests/out/*.png
            tests/out/*.log
