name: Idea
description: Suggest something that would make Foxtail better.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: If it's something macOS does, how does it work there?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
